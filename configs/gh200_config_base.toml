# Base GH200 configuration with DeepSpeed optimizations
output_dir = "outputs/gh200_training"
dataset = "examples/dataset.toml"

# Training settings
epochs = 1000
micro_batch_size_per_gpu = 1
pipeline_stages = 4
gradient_accumulation_steps = 4
gradient_clipping = 1.0
warmup_steps = 1000

# Evaluation settings
eval_every_n_epochs = 1
eval_before_first_step = true
eval_micro_batch_size_per_gpu = 1
eval_gradient_accumulation_steps = 1

# Checkpoint settings
save_every_n_epochs = 2
checkpoint_every_n_minutes = 120
activation_checkpointing = true
partition_method = "parameters"
save_dtype = "bfloat16"
caching_batch_size = 1
steps_per_print = 1

# GH200-specific DeepSpeed configuration
[ds_config]
zero_optimization = {
    stage = 2,
    cpu_offload = true,
    overlap_comm = true,
    contiguous_gradients = true,
    stage3_prefetch_bucket_size = 1e9,
    stage3_param_persistence_threshold = 1e7,
    reduce_bucket_size = 1e8,
    sub_group_size = 1e9,
    offload_optimizer = {
        device = "cpu",
        pin_memory = true,
        buffer_count = 4,
        fast_init = true
    },
    offload_param = {
        device = "cpu",
        pin_memory = true,
        buffer_count = 5,
        buffer_size = 1e9,
        max_in_cpu = 1e9
    },
    round_robin_gradients = true
}

tensor_parallel = {
    tp_size = 1,
    enabled = true
}

# Pipeline configuration
pipeline_parallel = {
    enabled = true,
    partition_method = "type:balanced",
    pipeline_parallel_size = 4,
    async_pipeline = true
}

# Memory optimization
memory_optimization = {
    initial_scale = 2^16,
    min_scale = 1,
    growth_factor = 2,
    backoff_factor = 0.5,
    max_scale = 2^32,
    hysteresis = 2,
    max_reserved_memory = 1e9
}

# Monitoring configuration
[monitoring]
wall_clock_breakdown = true
memory_breakdown = true
nvlink_monitoring = true
unified_memory_monitoring = true
verbose_logging = true
log_level = "WARNING"

# Optimizer configuration
[optimizer]
type = "adamw_optimi"
lr = 2e-5
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8

# Model settings
[model]
dtype = "bfloat16"
transformer_dtype = "float8"  # Optimized for GH200
guidance = 1.0
timestep_sample_method = "logit_normal" 